name: Deploy to Cloudflare Workers
# Trigger deployment verification from main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve deployment secrets
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dedicated secrets take priority. Legacy key names are compatibility fallbacks
          # during migration; set separate CHAT_* and SCANNER_* keys to isolate provider quotas.
          CHAT_GEMINI_API_KEY: ${{ secrets.CHAT_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          CHAT_GROQ_API_KEY: ${{ secrets.CHAT_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          CHAT_OPENROUTER_API_KEY: ${{ secrets.CHAT_OPENROUTER_API_KEY }}
          SCANNER_GEMINI_API_KEY: ${{ secrets.SCANNER_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          SCANNER_GROQ_API_KEY: ${{ secrets.SCANNER_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          SCANNER_OPENROUTER_API_KEY: ${{ secrets.SCANNER_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are not configured."
          fi
          for name in CHAT_GEMINI CHAT_GROQ CHAT_OPENROUTER SCANNER_GEMINI SCANNER_GROQ SCANNER_OPENROUTER; do
            value_name="${name}_API_KEY"
            if [ -n "${!value_name:-}" ]; then
              echo "${name,,}_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "${name,,}_ready=false" >> "$GITHUB_OUTPUT"
              echo "$value_name is not configured."
            fi
          done
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Build Cloudflare Worker
        run: bun run build
        env:
          NITRO_PRESET: cloudflare-module

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true'
        run: bunx wrangler@4.141.0 deploy --name ektaberha500-current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure chat Gemini secret
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.chat_gemini_ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_GEMINI_API_KEY: ${{ secrets.CHAT_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: printf '%s' "$CHAT_GEMINI_API_KEY" | bunx wrangler@4.141.0 secret put CHAT_GEMINI_API_KEY --name ektaberha500-current

      - name: Configure chat Groq secret
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.chat_groq_ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_GROQ_API_KEY: ${{ secrets.CHAT_GROQ_API_KEY || secrets.GROQ_API_KEY }}
        run: printf '%s' "$CHAT_GROQ_API_KEY" | bunx wrangler@4.141.0 secret put CHAT_GROQ_API_KEY --name ektaberha500-current

      - name: Configure chat OpenRouter secret
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.chat_openrouter_ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAT_OPENROUTER_API_KEY: ${{ secrets.CHAT_OPENROUTER_API_KEY }}
        run: printf '%s' "$CHAT_OPENROUTER_API_KEY" | bunx wrangler@4.141.0 secret put CHAT_OPENROUTER_API_KEY --name ektaberha500-current

      - name: Configure scanner Gemini secret
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.scanner_gemini_ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCANNER_GEMINI_API_KEY: ${{ secrets.SCANNER_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: printf '%s' "$SCANNER_GEMINI_API_KEY" | bunx wrangler@4.141.0 secret put SCANNER_GEMINI_API_KEY --name ektaberha500-current

      - name: Configure scanner Groq secret
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.scanner_groq_ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCANNER_GROQ_API_KEY: ${{ secrets.SCANNER_GROQ_API_KEY || secrets.GROQ_API_KEY }}
        run: printf '%s' "$SCANNER_GROQ_API_KEY" | bunx wrangler@4.141.0 secret put SCANNER_GROQ_API_KEY --name ektaberha500-current

      - name: Configure scanner OpenRouter secret
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.scanner_openrouter_ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCANNER_OPENROUTER_API_KEY: ${{ secrets.SCANNER_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
        run: printf '%s' "$SCANNER_OPENROUTER_API_KEY" | bunx wrangler@4.141.0 secret put SCANNER_OPENROUTER_API_KEY --name ektaberha500-current

      - name: Smoke test deployed application
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true'
        run: |
          set -euo pipefail
          BASE_URL="https://ektaberha500-current.sssoli5005.workers.dev"
          curl --fail --silent --show-error "$BASE_URL/" -o /tmp/athara-home.html
          grep -Eiq "أثَرة|ATHARA" /tmp/athara-home.html
          curl --fail --silent --show-error "$BASE_URL/api/health" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(input);
              const search = health.reverseImageSearch || {};
              if (!health.ok || health.service !== "ATHARA" || !health.aiBound ||
                  !search.geminiGoogleSearch || !search.groqBrowserSearch || !search.cloudflareWebSearch) {
                console.error("Health or search-provider capability check failed:", health);
                process.exit(1);
              }
              console.log("ATHARA health check passed; Gemini, Groq, and Cloudflare Web Search are available.");
            });
          '
          AUTH_STATUS="$(curl --silent --show-error -o /tmp/athara-auth.json -w "%{http_code}" "$BASE_URL/api/auth")"
          test "$AUTH_STATUS" = "200"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/athara-auth.json","utf8")); if(x.authenticated!==false) process.exit(1);'
          SCAN_STATUS="$(curl --silent --show-error -o /tmp/athara-scan.json -w "%{http_code}" -X POST "$BASE_URL/api/scan" -H "Content-Type: application/json" --data '{"language":"ar","mode":"objects"}')"
          test "$SCAN_STATUS" = "400"
          VISION_STATUS="$(curl --silent --show-error -o /tmp/athara-vision.json -w "%{http_code}" -X POST "$BASE_URL/api/scan" -H "Content-Type: application/json" --data '{"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAE0lEQVR4nGPYMi3vPz7MMDIUAACGH63BG4/H6QAAAABJRU5ErkJggg==","language":"ar","mode":"objects"}')"
          if [ "$VISION_STATUS" != "200" ]; then
            cat /tmp/athara-vision.json
            echo "Live vision scan returned HTTP $VISION_STATUS"
            exit 1
          fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/athara-vision.json","utf8")); const validResult = ["confirmed","probable","unverified","ai_guess"].includes(x.resultType); if(!x.ok || !validResult || !(typeof x.analysis==="string" && x.analysis.trim()) || !Array.isArray(x.sources)) { console.error("Cloudflare image scan returned an invalid result:", {model:x.model, resultType:x.resultType, sources:x.sources, error:x.error}); process.exit(1); } console.log("Live image scan returned a structured result; identity confidence:", x.confidenceByField?.identity || "not supplied");'
          CHAT_STATUS="$(curl --silent --show-error -o /tmp/athara-chat.json -w "%{http_code}" -X POST "$BASE_URL/api/chat" -H "Content-Type: application/json" --data '{"language":"ar","messages":[{"role":"user","content":"مرحبا"}]}')"
          test "$CHAT_STATUS" = "401"
          echo "Homepage, health, auth, scanner dispatch, and protected chat smoke tests passed."

      - name: Live artifact recognition test (official Nephthys image)
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready == 'true'
        env:
          ATHARA_BASE_URL: https://ektaberha500-current.sssoli5005.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const pageUrl = "https://egymonuments.gov.eg/en/collections/statue-of-nephthys-6/";
          const imageUrl = "https://egymonuments.gov.eg/media/4666/dsc_0802.jpg?anchor=center&height=423&mode=crop&rnd=132581519580000000&width=645";
          const imageResponse = await fetch(imageUrl, {
            headers: { "user-agent": "ATHARA-Live-Recognition-Test/1.0" },
            signal: AbortSignal.timeout(20000),
          });
          if (!imageResponse.ok) throw new Error("Official Ministry reference image returned HTTP " + imageResponse.status);
          const imageType = (imageResponse.headers.get("content-type") || "").split(";")[0];
          if (!imageType.startsWith("image/")) throw new Error("Ministry reference URL did not return an image: " + imageType);
          const imageBytes = Buffer.from(await imageResponse.arrayBuffer());
          if (!imageBytes.length || imageBytes.length > 8_000_000) throw new Error("Reference image size is invalid: " + imageBytes.length);
          console.log("Using the official Ministry image:", imageType, imageBytes.length + " bytes");
          const scanResponse = await fetch(new URL("/api/scan", process.env.ATHARA_BASE_URL), {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              image: "data:" + imageType + ";base64," + imageBytes.toString("base64"),
              language: "ar",
              mode: "objects",
              diagnostics: true,
            }),
            signal: AbortSignal.timeout(120000),
          });
          const result = await scanResponse.json().catch(() => null);
          if (!scanResponse.ok || !result?.ok) {
            console.error("Live artifact scan request failed:", scanResponse.status, result);
            process.exit(1);
          }
          const officialSource = (result.sources || []).some((source) =>
            typeof source.url === "string" && source.url.includes(new URL(pageUrl).pathname.replace(/\/$/, ""))
          );
          const identityText = [
            result.analysis,
            result.matchedArtifact?.name,
            ...(result.candidates || []).map((candidate) => candidate.name),
            ...(result.sources || []).map((source) => source.title),
          ].filter(Boolean).join(" ");
          const nephthysNamed = /نفتيس|nephthys|nebthet/i.test(identityText);
          const visuallyMatched =
            ["confirmed", "probable"].includes(result.identificationStatus) &&
            result.reverseImageSearchStatus === "match";
          const recognitionPassed = nephthysNamed && officialSource && visuallyMatched;
          const diagnosticDescription = [
            result.identificationStatus || "missing identity status",
            result.reverseImageSearchStatus || "missing match status",
            "Nephthys=" + nephthysNamed,
            "officialSource=" + officialSource,
            "visualMatch=" + visuallyMatched,
            "candidates=" + (result.candidates || []).length,
          ].join("; ").slice(0, 140);
          const statusResponse = await fetch(
            "https://api.github.com/repos/" + process.env.GITHUB_REPOSITORY +
              "/statuses/" + process.env.GITHUB_SHA,
            {
              method: "POST",
              headers: {
                "accept": "application/vnd.github+json",
                "authorization": "Bearer " + process.env.GITHUB_TOKEN,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
              },
              body: JSON.stringify({
                state: recognitionPassed ? "success" : "failure",
                context: "ATHARA live scanner recognition",
                description: diagnosticDescription,
                target_url: process.env.ATHARA_BASE_URL,
              }),
              signal: AbortSignal.timeout(15000),
            },
          );
          if (!statusResponse.ok) {
            throw new Error("Could not publish live scanner test status: HTTP " + statusResponse.status);
          }
          console.log("Published GitHub recognition status:", diagnosticDescription);
          console.log(JSON.stringify({
            identificationStatus: result.identificationStatus,
            reverseImageSearchStatus: result.reverseImageSearchStatus,
            confidenceByField: result.confidenceByField,
            visionDiagnostics: result.visionDiagnostics || null,
            imageRetrievalDiagnostics: result.imageRetrievalDiagnostics || null,
            matchedArtifact: result.matchedArtifact || null,
            candidates: result.candidates || [],
            sources: result.sources,
            nephthysNamed,
            officialMinistryCatalogueSource: officialSource,
            visuallyMatched,
            analysis: result.analysis,
          }, null, 2));
          if (!recognitionPassed) {
            console.error("LIVE ARTIFACT RECOGNITION FAILED: the same Ministry catalogue image must return the Nephthys identity, its official record, and a visual match.");
            process.exit(1);
          }
          console.log("LIVE ARTIFACT RECOGNITION PASSED: Nephthys is visually matched to the official Ministry catalogue record.");
          NODE

      - name: Explain skipped deployment
        if: github.event_name != 'pull_request' && steps.credentials.outputs.cloudflare_ready != 'true'
        run: |
          echo "Build and tests passed, but deployment was skipped."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository Actions secrets to publish this commit."

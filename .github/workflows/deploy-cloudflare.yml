name: Deploy to Cloudflare Workers
# Trigger deployment verification from main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify chat provider secrets
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing from GitHub Actions repository secrets."
            exit 1
          fi
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is missing from GitHub Actions repository secrets."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Build Cloudflare Worker
        run: bun run build
        env:
          NITRO_PRESET: cloudflare-module

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: bunx wrangler@4.68.0 deploy --config .output/server/wrangler.json

      - name: Configure Gemini chat secret
        if: env.GEMINI_API_KEY != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: printf '%s' "$GEMINI_API_KEY" | bunx wrangler@4.68.0 secret put GEMINI_API_KEY --config .output/server/wrangler.json

      - name: Configure Groq chat secret
        if: env.GROQ_API_KEY != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: printf '%s' "$GROQ_API_KEY" | bunx wrangler@4.68.0 secret put GROQ_API_KEY --config .output/server/wrangler.json

      - name: Smoke test deployed application
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          BASE_URL="https://memansisis-wq-ektaberha500.memansisis.workers.dev"
          curl --fail --silent --show-error "$BASE_URL/" -o /tmp/athara-home.html
          grep -Eiq "أثَرة|ATHARA" /tmp/athara-home.html
          curl --fail --silent --show-error "$BASE_URL/api/health" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(input);
              if (!health.ok || health.service !== "ATHARA" || !health.aiBound) {
                console.error("Health check failed:", health);
                process.exit(1);
              }
              console.log("ATHARA health check passed; AI binding is available.");
            });
          '
          AUTH_STATUS="$(curl --silent --show-error -o /tmp/athara-auth.json -w "%{http_code}" "$BASE_URL/api/auth")"
          test "$AUTH_STATUS" = "200"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/athara-auth.json","utf8")); if(x.authenticated!==false) process.exit(1);'
          SCAN_STATUS="$(curl --silent --show-error -o /tmp/athara-scan.json -w "%{http_code}" -X POST "$BASE_URL/api/scan" -H "Content-Type: application/json" --data '{"language":"ar","mode":"objects"}')"
          test "$SCAN_STATUS" = "400"
          VISION_STATUS="$(curl --silent --show-error -o /tmp/athara-vision.json -w "%{http_code}" -X POST "$BASE_URL/api/scan" -H "Content-Type: application/json" --data '{"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAE0lEQVR4nGPYMi3vPz7MMDIUAACGH63BG4/H6QAAAABJRU5ErkJggg==","language":"ar","mode":"objects"}')"
          if [ "$VISION_STATUS" != "200" ]; then
            cat /tmp/athara-vision.json
            echo "Live vision scan returned HTTP $VISION_STATUS"
            exit 1
          fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/athara-vision.json","utf8")); if(!x.ok || !x.analysis || x.resultType!=="ai_guess" || !x.model?.startsWith("Cloudflare Workers AI")) { console.error("Cloudflare vision scan failed:", {model:x.model, diagnostics:x.visionDiagnostics, error:x.error}); process.exit(1); } console.log("Live Cloudflare vision inference passed.");'
          CHAT_STATUS="$(curl --silent --show-error -o /tmp/athara-chat.json -w "%{http_code}" -X POST "$BASE_URL/api/chat" -H "Content-Type: application/json" --data '{"language":"ar","messages":[{"role":"user","content":"مرحبا"}]}')"
          test "$CHAT_STATUS" = "401"
          echo "Homepage, health, auth, scanner dispatch, and protected chat smoke tests passed."

      - name: Explain skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Build and tests passed. Deployment was skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured as GitHub Actions repository secrets."
          echo "Add both secrets, then run this workflow again from the Actions tab."

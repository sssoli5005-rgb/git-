name: Temporary ATHARA live scanner verification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test published image scanner with an official museum photograph
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://ektaberha500-current.sssoli5005.workers.dev";
          const healthResponse = await fetch(base + "/api/health", { signal: AbortSignal.timeout(30000) });
          const health = await healthResponse.json();
          console.log("LIVE HEALTH:", JSON.stringify(health, null, 2));
          if (!healthResponse.ok || health.service !== "ATHARA" || !health.aiBound) throw new Error("Published health check failed.");
          const imageUrl = "https://images.metmuseum.org/CRDImages/eg/original/DP330277.jpg";
          const imageResponse = await fetch(imageUrl, { signal: AbortSignal.timeout(30000) });
          if (!imageResponse.ok) throw new Error("Museum image download failed: HTTP " + imageResponse.status);
          const bytes = Buffer.from(await imageResponse.arrayBuffer());
          if (!bytes.length || bytes.length > 5_000_000) throw new Error("Unexpected test image size: " + bytes.length);
          const response = await fetch(base + "/api/scan", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ image: "data:image/jpeg;base64," + bytes.toString("base64"), language: "ar", mode: "objects" }),
            signal: AbortSignal.timeout(180000)
          });
          const result = await response.json();
          console.log("LIVE SCAN:", JSON.stringify(result, null, 2));
          if (!response.ok || result.ok !== true || !String(result.analysis || "").trim()) throw new Error("Live scanner returned an invalid response.");
          if (result.reverseImageSearchStatus === "failed" && result.visionDiagnostics?.provider === "No vision engine completed") {
            throw new Error("All configured visual engines failed on the live image.");
          }
          console.log("PASS: published image scanner completed analysis; result classification: " + result.resultType + "; search: " + result.reverseImageSearchStatus);
          NODE

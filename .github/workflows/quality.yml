name: Chat quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run unit and conversation tests
        run: bun run test
      - name: Run lint checks
        run: >-
          bunx eslint . --rule 'prettier/prettier: off' --max-warnings 10
      - name: Build production app
        run: bun run build

name: Scanner tests

on:
  push:
    branches: [main]
    paths:
      - "src/athara-worker.js"
      - "src/athara-worker.test.ts"
      - "package.json"
      - ".github/workflows/scanner-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run scanner tests
        run: bunx vitest run src/athara-worker.test.ts
